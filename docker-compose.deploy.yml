version: '3.8'

services:
  topmontadores:
    image: dokploy-topmontadores:latest
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - dokploy-network
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # Supabase (server-side)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Sanity (server-side)
      - SANITY_API_TOKEN=${SANITY_API_TOKEN}
      - SANITY_API_VERSION=${SANITY_API_VERSION}
      - SANITY_STUDIO_PROJECT_ID=${SANITY_STUDIO_PROJECT_ID}
      - SANITY_STUDIO_DATASET=${SANITY_STUDIO_DATASET}
      - SANITY_STUDIO_TITLE=${SANITY_STUDIO_TITLE}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.topmontadores-web.rule=Host(`topmontadores.gearclube.com.br`)"
      - "traefik.http.routers.topmontadores-web.entrypoints=web"
      - "traefik.http.services.topmontadores-web.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  dokploy-network:
    external: true